version: 2

# Mocked staging inputs: the real extract has only one rejected row (the orphan payment),
# so the other rules are exercised here.
unit_tests:
  - name: int_quarantine_orphan_payment_is_rejected
    description: A payment for an unknown agreement is quarantined with currency UNKNOWN; a valid payment is not listed.
    model: int_quarantine_records
    given:
      - input: ref('stg_agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: 6000.00, updated_at: '2026-01-02 09:00:00', row_hash: h-a001, is_conflicting_version: false}
      - input: ref('stg_schedule')
        rows:
          - {installment_id: A001-1, agreement_id: A001, due_date: '2026-01-15', due_amount: 1000.25, updated_at: '2026-01-02 09:00:00', row_hash: h-s1, is_conflicting_version: false}
      - input: ref('stg_payments')
        rows:
          - {payment_id: P-OK, agreement_id: A001, payment_date: '2026-01-16', amount: 100.00, status: POSTED, updated_at: '2026-01-15 12:00:00', row_hash: h-p1, is_conflicting_version: false}
          - {payment_id: P-BAD, agreement_id: A999, payment_date: '2026-02-01', amount: 20.25, status: POSTED, updated_at: '2026-02-01 10:00:00', row_hash: h-p2, is_conflicting_version: false}
    expect:
      rows:
        - {source_table: payments, record_key: P-BAD, agreement_id: A999, amount: 20.25, currency: UNKNOWN, reason: ORPHAN_PAYMENT, excluded_from_metrics: true}

  - name: int_quarantine_invalid_agreement_orphans_its_installments
    description: An agreement with a country/currency mismatch is rejected, so its installments become orphans.
    model: int_quarantine_records
    given:
      - input: ref('stg_agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: 6000.00, updated_at: '2026-01-02 09:00:00', row_hash: h-a001, is_conflicting_version: false}
          - {agreement_id: A002, customer_id: C002, country: UG, product: BODA, currency: KES, origination_date: '2026-01-01', principal_amount: 5000.00, updated_at: '2026-01-02 09:00:00', row_hash: h-a002, is_conflicting_version: false}
      - input: ref('stg_schedule')
        rows:
          - {installment_id: A001-1, agreement_id: A001, due_date: '2026-01-15', due_amount: 1000.25, updated_at: '2026-01-02 09:00:00', row_hash: h-s1, is_conflicting_version: false}
          - {installment_id: A002-1, agreement_id: A002, due_date: '2026-01-15', due_amount: 900.00, updated_at: '2026-01-02 09:00:00', row_hash: h-s2, is_conflicting_version: false}
      - input: ref('stg_payments')
        rows:
          - {payment_id: P-OK, agreement_id: A001, payment_date: '2026-01-16', amount: 100.00, status: POSTED, updated_at: '2026-01-15 12:00:00', row_hash: h-p1, is_conflicting_version: false}
    expect:
      rows:
        - {source_table: agreements, record_key: A002, agreement_id: A002, currency: KES, reason: COUNTRY_CURRENCY_MISMATCH, excluded_from_metrics: true}
        - {source_table: schedule, record_key: A002-1, agreement_id: A002, currency: UNKNOWN, reason: ORPHAN_INSTALLMENT, excluded_from_metrics: true}

  - name: int_quarantine_conflict_is_listed_but_not_excluded
    description: A conflicting version is listed for review and stays in the metrics.
    model: int_quarantine_records
    given:
      - input: ref('stg_agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: 6000.00, updated_at: '2026-01-02 09:00:00', row_hash: h-a001, is_conflicting_version: true}
      - input: ref('stg_schedule')
        rows:
          - {installment_id: A001-1, agreement_id: A001, due_date: '2026-01-15', due_amount: 1000.25, updated_at: '2026-01-02 09:00:00', row_hash: h-s1, is_conflicting_version: false}
      - input: ref('stg_payments')
        rows:
          - {payment_id: P-OK, agreement_id: A001, payment_date: '2026-01-16', amount: 100.00, status: POSTED, updated_at: '2026-01-15 12:00:00', row_hash: h-p1, is_conflicting_version: false}
    expect:
      rows:
        - {source_table: agreements, record_key: A001, currency: KES, reason: CONFLICTING_VERSION, excluded_from_metrics: false}
