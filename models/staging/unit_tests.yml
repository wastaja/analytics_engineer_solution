version: 2

# The extract contains no same-timestamp conflicts, so these mocked inputs are the only
# place where the conflict flag and the tie-break logic are actually exercised.
unit_tests:
  - name: stg_agreements_latest_version_wins
    description: A newer updated_at replaces the older version; this is not a conflict.
    model: stg_agreements
    given:
      - input: ref('agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '6000.00', updated_at: '2026-01-01 09:00:00'}
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '6010.25', updated_at: '2026-01-02 09:00:00'}
    expect:
      rows:
        - {agreement_id: A001, principal_amount: 6010.25, is_conflicting_version: false}

  - name: stg_agreements_exact_duplicate_is_not_a_conflict
    description: Identical rows collapse to one row and are not flagged.
    model: stg_agreements
    given:
      - input: ref('agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '6000.00', updated_at: '2026-01-02 09:00:00'}
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '6000.00', updated_at: '2026-01-02 09:00:00'}
    expect:
      rows:
        - {agreement_id: A001, is_conflicting_version: false}

  - name: stg_agreements_same_timestamp_different_content_is_flagged
    description: Same key and updated_at with different content yields one row, flagged as conflicting.
    model: stg_agreements
    given:
      - input: ref('agreements')
        rows:
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '6000.00', updated_at: '2026-01-02 09:00:00'}
          - {agreement_id: A001, customer_id: C001, country: KE, product: PHONES, currency: KES, origination_date: '2026-01-01', principal_amount: '7000.00', updated_at: '2026-01-02 09:00:00'}
    expect:
      rows:
        - {agreement_id: A001, is_conflicting_version: true}

  - name: stg_agreements_normalizes_text
    description: Text is trimmed and uppercased, and blank values become NULL.
    model: stg_agreements
    given:
      - input: ref('agreements')
        rows:
          - {agreement_id: ' a001 ', customer_id: C001, country: ' ke ', product: ' phones ', currency: '   ', origination_date: '2026-01-01', principal_amount: '6000.00', updated_at: '2026-01-02 09:00:00'}
    expect:
      rows:
        - {agreement_id: A001, country: KE, product: PHONES, currency: null}

  - name: stg_schedule_same_timestamp_different_amount_is_flagged
    description: Two installment versions with the same updated_at and different amounts are flagged.
    model: stg_schedule
    given:
      - input: ref('schedule')
        rows:
          - {installment_id: A001-1, agreement_id: A001, due_date: '2026-01-15', due_amount: '1000.25', updated_at: '2026-01-02 09:00:00'}
          - {installment_id: A001-1, agreement_id: A001, due_date: '2026-01-15', due_amount: '1100.75', updated_at: '2026-01-02 09:00:00'}
    expect:
      rows:
        - {installment_id: A001-1, is_conflicting_version: true}

  - name: stg_payments_latest_reversed_overrides_posted
    description: A newer REVERSED version replaces the older POSTED one, before any status filter.
    model: stg_payments
    given:
      - input: ref('payments')
        rows:
          - {payment_id: P-REVERSE, agreement_id: A001, payment_date: '2026-01-20', amount: '250.50', status: POSTED, updated_at: '2026-01-20 10:00:00'}
          - {payment_id: P-REVERSE, agreement_id: A001, payment_date: '2026-01-20', amount: '250.50', status: REVERSED, updated_at: '2026-01-21 10:00:00'}
    expect:
      rows:
        - {payment_id: P-REVERSE, status: REVERSED, is_conflicting_version: false}

  - name: stg_payments_same_timestamp_different_status_is_flagged
    description: Same payment_id and updated_at with different status is flagged as conflicting.
    model: stg_payments
    given:
      - input: ref('payments')
        rows:
          - {payment_id: P-X, agreement_id: A001, payment_date: '2026-01-20', amount: '10.00', status: POSTED, updated_at: '2026-01-20 10:00:00'}
          - {payment_id: P-X, agreement_id: A001, payment_date: '2026-01-20', amount: '10.00', status: PENDING, updated_at: '2026-01-20 10:00:00'}
    expect:
      rows:
        - {payment_id: P-X, is_conflicting_version: true}
